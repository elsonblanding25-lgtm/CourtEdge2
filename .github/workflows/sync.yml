
name: Refresh basketball games and results

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh basketball data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SYNC_DAYS: "3"
        run: node scripts/sync.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/games.json public/data/games_archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Update basketball games and results"
            git push
          fi
